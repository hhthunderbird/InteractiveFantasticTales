          - generic [ref=e314]:
            - generic [ref=e316]:
              - heading "About This Game" [level=2] [ref=e317]
              - paragraph [ref=e318]:
                - img [ref=e320]
              - paragraph [ref=e321]: Ready your sword, pack your provisions and prepare to embark upon nostalgic quests of epic proportions where YOU choose what happens next! Journey a magical realm, fighting monsters and unravelling mysteries in Fighting Fantasy Classics – text-based roleplaying adventures remastered. Originally presented by Steve Jackson & Ian Livingstone in the 80s and 90s, Fighting Fantasy Classics brings these timeless tales back to your gaming library.
              - paragraph [ref=e322]
              - paragraph [ref=e323]:
                - img [ref=e325]
              - heading "FEATURES" [level=2] [ref=e326]
              - list [ref=e327]:
                - listitem [ref=e328]:
                  - paragraph [ref=e329]:
                    - text: Every player receives Jonathan Green's swashbuckling pirate adventure - Bloodbones - free with their download.
                    - img [ref=e331]
                - listitem [ref=e332]:
                  - paragraph [ref=e333]: 20+ digital gamebooks are available to purchase including classics such as Deathtrap Dungeon, Starship Traveller, Caverns of the Snow Witch, Citadel of Chaos, City of Thieves, Scorpion Swamp, House of Hell, The Forest of Doom, Island of the Lizard King, Freeway Fighter, Armies of Death, Trial of Champions, Temple of Terror, Appointment with FEAR and The Warlock of Firetop Mountain (original gamebook version).
                - listitem [ref=e334]:
                  - paragraph [ref=e335]: More recent Fighting Fantasy gamebooks are also available, such as The Port of Peril and Assassins of Allansia, with many more in development!
              - heading "Pause animation" [level=2] [ref=e336]:
                - button "Pause animation" [ref=e340]:
                  - img "Pause animation" [ref=e341]
              - list [ref=e342]:
                - listitem [ref=e343]:
                  - paragraph [ref=e344]: Make the gamebooks as easy or hard as you like and even turn on a special 'Free Read' mode to play the book like an old-school cheater!
                - listitem [ref=e345]:
                  - paragraph [ref=e346]: Map feature makes it easy to keep track of everywhere you have explored during current and previous playthroughs.
                - listitem [ref=e347]:
                  - paragraph [ref=e348]: Unlimited Bookmarks allow you to revisit difficult sections as many times as desired.
                - listitem [ref=e349]:
                  - paragraph [ref=e350]: Classic, original artwork from Iain McCaig, Russ Nicholson, Malcolm Barter, Ian Miller and more! All viewable through a collectable artwork gallery.
                - listitem [ref=e351]:
                  - paragraph [ref=e352]: Automated Adventure Sheet that keeps track of your stats, inventory and knowledge gained during your journey.
                - listitem [ref=e353]:
                  - paragraph [ref=e354]: Specially composed, atmospheric soundtrack and effects.
                - listitem [ref=e355]:
                  - paragraph [ref=e356]: History of Fighting Fantasy and Rulebook titles, included as free books on the shelf for all players.
              - paragraph [ref=e357]
              - paragraph [ref=e358]: Traverse the realm of Allansia, using your might and magic to hunt down evil sorcerers. Brave the dangers of Darkwood Forest to help save a doomed village of dwarves. Seek vengeance from the Pirate Lord who murdered your family and destroyed your life many moons ago. Save a port-town from the wrath of an undead lord and his ghostly hound minions!
              - paragraph [ref=e359]
              - paragraph [ref=e360]: Part story, part game, in these adventures YOU ARE THE HERO!
            - generic [ref=e362] [cursor=pointer]: READ MORE
