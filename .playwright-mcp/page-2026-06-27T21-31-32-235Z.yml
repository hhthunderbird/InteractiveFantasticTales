                  - text: I've only attempted the bloodbones scenario that comes with the game free, and although the scenario is mostly well-written (bar "you feel like this item is important" deus ex machina messages) and interesting enough, actually playing through it is an awful experience, especially when compared to the masterpiece that is Sorcery!.
                  - text: "Choices are largely divided up between necessary to complete the game and \"Oops! You're dead, game over\". This is mildly annoying, but isn't what ruins the game. What does is two things: constant abuse of the luck mechanic, and skewed dice rolls (or just genuinely bad luck). The game *very* regularly tests your luck stat - and every time it does, pass or fail, it lowers your luck by 1."
                  - text: "The problem? Your luck is tested nearly every second page. Here's a scenario I encountered: I failed a luck roll, and was forced into a difficult fight. I won the fight, and was immediately forced to take another luck roll BECAUSE I won, which was even harder because the previous luck roll reduced my luck by 1. I failed the second luck roll, and bam - instant game over. There's no middle ground - if you fail, you die. For reference, all luck checks are 2d6 - if you're cursed to start the game with a luck of 7 like me, you may as well just give up immediately."
                  - text: As for the skewed dive rolls... the first time I encountered an enemy that had a higher "skill" stat than me which merely gave it +1 to its rolls, it was unbeatable. I reloaded for a solid 30 minutes and didn't even come close to beating it, because it consistently rolled higher than me - and every enemy before that was beaten merely because I had a much higher skill bonus.
                  - text: The entire scenario has been designed around having max stats and save-scumming. If you have anything less, it genuinely becomes an unpleasant experience.
