                - img [ref=f9e606]
                - img [ref=f9e608]
                - strong [ref=f9e609]: Epistory
                - text: is an atmospheric adventure typing game that tells the story of a writer lacking inspiration who asks her muse to help write her latest book.
                - text: In Epistory you play the muse, a fictional character in a world where everything is untold. Your adventure begins on a blank page, but the world will soon become larger and livelier as you
                - strong [ref=f9e610]: gather inspiration
                - text: ","
                - strong [ref=f9e611]: solve its mysteries
                - text: and
                - strong [ref=f9e612]: defeat its enemies
                - text: . From movement to opening chests and fighting in epic battles, every element in the game is controlled exclusively with the keyboard.
                - text: As you progress and explore the fantasy origami world, the story literally unfolds in the writer’s mind and the mysteries of the magic power of the words are revealed.
                - heading "Features" [level=2] [ref=f9e613]
                - list [ref=f9e614]:
                  - listitem [ref=f9e615]:
                    - strong [ref=f9e616]: "Explore a beautiful paper craft world:"
                    - text: play as the muse riding a giant three tailed fox, lost in a fantasy 3D world
                  - listitem [ref=f9e617]:
                    - strong [ref=f9e618]: "More than just typing:"
                    - text: solve mysterious puzzles, unlock magic powers and defeat enemies in adrenaline pumping epic combats
                  - listitem [ref=f9e619]:
                    - strong [ref=f9e620]: A writer’s block?
                    - text: Collect fragments and inspirations points to unfold the story as you explore the origami world in the writer’s head. But there is more to the story than meets the eye…
                  - listitem [ref=f9e621]:
                    - strong [ref=f9e622]: "All in keyboard:"
                    - text: from movements, combats to even menus, control everything with a keyboard
                  - listitem [ref=f9e623]:
                    - strong [ref=f9e624]: "Adaptive difficulty:"
                    - text: if your hands fly around the keyboard or if you are a slow typist, the game features a dynamic difficulty system that evolves to fit each players’ skill set
                  - listitem [ref=f9e625]:
                    - strong [ref=f9e626]: "Competitive Arena Mode:"
                    - text: challenge other players for the top spot in the arena leaderboards
                  - listitem [ref=f9e627]:
                    - strong [ref=f9e628]: "Play in your own language:"
                    - text: game texts are localized in English, French, German, Spanish, Portuguese (Brazil), Russian, Polish with voice overs in English. The game supports several keyboard layouts (QWERTY, QWERTZ, AZERTY, BEPO, Dvorak, Workman and Colemak)
